<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de conexão — PoC de rede</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<main class="narrow">
  <h1>Teste de conexão com a sala</h1>
  <p class="muted" id="room">Carregando dados da sala…</p>

  <section class="card" style="margin-top:16px">
    <form id="form" class="row">
      <label for="machine">Nome ou número deste computador</label>
      <input id="machine" required maxlength="60" placeholder="ex.: LAB2-PC07" autocomplete="off">
      <button id="start" type="submit">Iniciar teste</button>
    </form>
    <p class="muted">O navegador não sabe o nome da máquina; use o que está na etiqueta do computador.</p>
  </section>

  <div id="status" class="status-big warn" hidden role="status"></div>

  <section class="card" style="margin-top:16px" id="steps-card" hidden>
    <h2>Etapas</h2>
    <ul class="steps" id="steps"></ul>
  </section>

  <p class="muted" id="live" style="margin-top:12px"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);
const via = params.get("via") === "udp" ? "udp" : "digitado";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let clientId = store.get("poc-rede-id");
if (!clientId) {
  clientId = "nav-" + Math.random().toString(36).slice(2, 10);
  store.set("poc-rede-id", clientId);
}
let info = null;
let ws = null;
let wsWanted = false;
const pongWaiters = new Map();

function summarize(xs) {
  if (!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b);
  const r = (x) => Math.round(x * 10) / 10;
  return { n: s.length, min: r(s[0]), avg: r(s.reduce((a, b) => a + b, 0) / s.length), p95: r(s[Math.min(s.length - 1, Math.ceil(s.length * 0.95) - 1)]), max: r(s[s.length - 1]) };
}

function step(text) {
  const li = document.createElement("li");
  li.textContent = "… " + text;
  $("steps").appendChild(li);
  return (ok, detail) => {
    li.innerHTML = `${ok ? '<span class="b ok">✓ ok</span>' : '<span class="b fail">✗ falhou</span>'} ${esc(text)}${detail ? ` <span class="muted">— ${esc(detail)}</span>` : ""}`;
  };
}

async function timedFetch(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  const t0 = performance.now();
  try {
    const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    const t = Math.round((performance.now() - t0) * 10) / 10;
    if (!res.ok) return { ok: false, ms: t, error: "HTTP " + res.status };
    await res.json();
    return { ok: true, ms: t };
  } catch (e) {
    return { ok: false, ms: Math.round(performance.now() - t0), error: e.name === "AbortError" ? `sem resposta em ${ms / 1000} s` : e.message };
  } finally {
    clearTimeout(timer);
  }
}

function wsUrl(machine) {
  const q = new URLSearchParams({ role: "client", kind: "navegador", clientId, machine, via });
  return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?" + q;
}

// Persistent connection with automatic reconnect, like the real product will have.
function connect(machine) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    const sock = new WebSocket(wsUrl(machine));
    let opened = false;
    const timer = setTimeout(() => { if (!opened) { sock.close(); reject(new Error("tempo esgotado (5 s)")); } }, 5000);
    sock.onopen = () => {
      opened = true;
      clearTimeout(timer);
      ws = sock;
      sock.send(JSON.stringify({ type: "hello", userAgent: navigator.userAgent }));
      $("live").textContent = "● Conectado à sala. Pode deixar esta página aberta.";
      resolve(Math.round((performance.now() - t0) * 10) / 10);
    };
    sock.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "hping") sock.send(JSON.stringify({ type: "hpong", t: m.t }));
      else if (m.type === "pong") { const w = pongWaiters.get(m.t); if (w) { pongWaiters.delete(m.t); w(); } }
    };
    sock.onerror = () => { if (!opened) { clearTimeout(timer); reject(new Error("falha ao conectar")); } };
    sock.onclose = (e) => {
      if (!opened) { clearTimeout(timer); reject(new Error(`conexão fechada (código ${e.code})`)); return; }
      ws = null;
      if (wsWanted) {
        $("live").textContent = "○ Conexão perdida — tentando reconectar…";
        setTimeout(() => connect(machine).catch(() => {}), 3000);
      }
    };
  });
}

function ping() {
  return new Promise((resolve) => {
    const t = performance.now();
    const timer = setTimeout(() => { pongWaiters.delete(t); resolve(null); }, 3000);
    pongWaiters.set(t, () => { clearTimeout(timer); resolve(performance.now() - t); });
    ws.send(JSON.stringify({ type: "ping", t }));
  });
}

async function runTest(machine) {
  $("start").disabled = true;
  $("steps").innerHTML = "";
  $("steps-card").hidden = false;
  const status = $("status");
  status.hidden = false;
  status.className = "status-big warn";
  status.textContent = "Testando…";

  const result = { clientId, kind: "navegador", machine, via, userAgent: navigator.userAgent, http: { ok: false }, ws: { ok: false }, latency: null, ports: [] };

  let done = step("HTTP até o computador do professor");
  result.http = await timedFetch("/ping?t=" + Date.now(), 5000);
  done(result.http.ok, result.http.ok ? `${result.http.ms} ms` : result.http.error);

  done = step("WebSocket (tempo real)");
  try {
    wsWanted = true;
    const ms = ws ? 0 : await connect(machine);
    result.ws = { ok: true, ms };
    done(true, `${ms} ms para conectar`);
    done = step("Latência (20 mensagens)");
    const rtts = [];
    for (let i = 0; i < 20; i++) {
      const r = await ping();
      if (r !== null) rtts.push(r);
      await new Promise((r) => setTimeout(r, 100));
    }
    result.latency = summarize(rtts);
    done(rtts.length > 0, result.latency ? `média ${result.latency.avg} ms, máx ${result.latency.max} ms, ${rtts.length}/20 respostas` : "nenhuma resposta");
  } catch (e) {
    wsWanted = false;
    result.ws = { ok: false, error: e.message };
    done(false, e.message);
  }

  const ports = info?.openPorts?.length ? info.openPorts : [Number(location.port || 80)];
  for (const p of ports) {
    done = step(`Porta ${p}`);
    const r = Number(location.port || 80) === p ? result.http : await timedFetch(`${location.protocol}//${location.hostname}:${p}/ping?t=${Date.now()}`, 3000);
    result.ports.push({ port: p, ok: r.ok, ms: r.ms, error: r.error });
    done(r.ok, r.ok ? `${r.ms} ms` : r.error);
  }

  done = step("Enviar resultado ao professor");
  try {
    const res = await fetch("/api/resultado", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(result) });
    done(res.ok, res.ok ? "" : "HTTP " + res.status);
  } catch (e) {
    done(false, e.message);
  }

  if (result.http.ok && result.ws.ok) {
    status.className = "status-big ok";
    status.textContent = "✓ Conexão OK. Este computador consegue participar da aula. Avise o professor.";
  } else if (result.http.ok) {
    status.className = "status-big warn";
    status.textContent = "⚠ HTTP funcionou, mas o tempo real (WebSocket) não. Anote e avise o professor.";
  } else {
    status.className = "status-big fail";
    status.textContent = "✗ Não foi possível falar com o computador do professor. Anote e avise o professor.";
  }
  $("start").disabled = false;
  $("start").textContent = "Testar de novo";
}

(async () => {
  const pre = params.get("maquina") || store.get("poc-rede-maquina") || "";
  $("machine").value = pre;
  try {
    const res = await fetch("/api/info", { cache: "no-store" });
    info = await res.json();
    $("room").textContent = `Sala: ${info.roomName} · código ${info.code} · computador do professor: ${info.machine}`;
  } catch {
    $("room").textContent = "Não foi possível ler os dados da sala.";
  }
  if (params.get("maquina")) runTest(pre);
})();

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const m = $("machine").value.trim();
  if (!m) return;
  store.set("poc-rede-maquina", m);
  runTest(m);
});
</script>
</body>
</html>
